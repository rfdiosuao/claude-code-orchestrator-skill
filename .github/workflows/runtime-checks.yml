name: Runtime checks

on:
  push:
    branches:
      - main
    paths:
      - scripts/cc-orchestrator/**
      - install/**
      - examples/workflows/**
      - docs/superpowers/**
      - docs-site/**
      - README.md
      - README.zh-CN.md
      - SKILL.md
      - version.json
      - package.json
      - package-lock.json
      - .gitignore
      - .github/workflows/deploy-docs.yml
      - .github/workflows/runtime-checks.yml
  pull_request:
    paths:
      - scripts/cc-orchestrator/**
      - install/**
      - examples/workflows/**
      - docs/superpowers/**
      - docs-site/**
      - README.md
      - README.zh-CN.md
      - SKILL.md
      - version.json
      - package.json
      - package-lock.json
      - .gitignore
      - .github/workflows/deploy-docs.yml
      - .github/workflows/runtime-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/cc-orchestrator/requirements-runtime.txt

      - name: Compile Python entrypoints
        run: python -m py_compile scripts/cc-orchestrator/cc_orchestrator.py scripts/cc-orchestrator/runtime_security.py scripts/cc-orchestrator/process_identity.py scripts/cc-orchestrator/secure_payload_store.py scripts/cc-orchestrator/server.py

      - name: Run complete runtime test suite
        run: python -m unittest discover -s scripts/cc-orchestrator/tests -v

      - name: Run orchestrator selftest
        run: python scripts/cc-orchestrator/cc_orchestrator.py selftest

      - name: Run mock streaming integration test
        run: python scripts/cc-orchestrator/cc_orchestrator.py mock-stream-test --timeout-seconds 60

  runtime-posix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/cc-orchestrator/requirements-runtime.txt

      - name: Compile Python entrypoints
        run: python -m py_compile scripts/cc-orchestrator/cc_orchestrator.py scripts/cc-orchestrator/runtime_security.py scripts/cc-orchestrator/process_identity.py scripts/cc-orchestrator/secure_payload_store.py scripts/cc-orchestrator/server.py

      - name: Run POSIX release contract suite
        working-directory: scripts/cc-orchestrator/tests
        run: >-
          python -m unittest -v
          test_process_identity
          test_runtime_security
          test_secure_payload_store
          test_release_contract
          test_selftest_contract
          test_install_preservation.InstallerPreservationTests.test_both_installers_preserve_only_the_installed_runtime_override
          test_install_preservation.InstallerPreservationTests.test_native_installer_preserves_override_and_ignores_workspace_audit_key
          test_install_preservation.InstallerPreservationTests.test_release_manifests_agree_and_declare_runtime_override
          test_guarded_launch.TenthReviewPortableIdentityEncodingTests
          test_guarded_launch.TenthReviewPosixPathEncodingTests.test_surrogateescaped_and_literal_keys_remain_distinct
          test_guarded_launch.TenthReviewPosixPathEncodingTests.test_git_subprocess_requests_surrogateescape_decoding
          test_guarded_launch.TaskSevenStopIdentityTests.test_production_posix_launch_fails_before_any_runtime_process
          test_guarded_launch.TaskSevenStopIdentityTests.test_production_posix_fails_closed_in_fresh_thread
          test_guarded_launch.TaskSevenStopIdentityTests.test_production_posix_fails_closed_in_fresh_spawn
          test_guarded_launch.TaskSevenStopIdentityTests.test_runtime_tree_support_names_only_kernel_enforced_mechanism

      - name: Run Linux byte-path and launch-boundary contracts
        if: runner.os == 'Linux'
        working-directory: scripts/cc-orchestrator/tests
        run: >-
          python -m unittest -v
          test_guarded_launch.TenthReviewPosixPathEncodingTests.test_non_utf8_unicode_and_backslash_names_recover_distinct_exact_bytes

      - name: Verify production selftest fails closed
        shell: python
        run: |
          import json
          import subprocess
          import sys

          completed = subprocess.run(
              [sys.executable, "scripts/cc-orchestrator/cc_orchestrator.py", "selftest"],
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="replace",
              check=False,
          )
          assert completed.returncode != 0, completed.stdout
          payload = json.loads(completed.stdout)
          containment = payload["runtime_security"]["process_tree_containment"]
          assert containment["supported"] is False, containment
          assert containment["mechanism"] is None, containment
          assert containment["test_only"] is False, containment

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Check release version consistency
        shell: python
        run: |
          import json
          from pathlib import Path

          root = json.loads(Path("version.json").read_text(encoding="utf-8"))
          portable = json.loads(Path("scripts/cc-orchestrator/version.json").read_text(encoding="utf-8"))
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          assert root == portable
          assert root["version"] == "0.8.0"
          assert root["released_at"] == "2026-07-18"
          assert any("guarded runtime" in note.lower() for note in root["notes"])
          assert root["version"] == package["version"] == lock["version"] == lock["packages"][""]["version"]

      - name: Scan tracked files for secrets
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import sys

          patterns = [
              re.compile(r"(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{10,}"),
              re.compile(r"(?<![A-Za-z0-9_])ghp_[A-Za-z0-9_]{20,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"npm_[A-Za-z0-9]{20,}"),
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"AIza[0-9A-Za-z_-]{35}"),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/=-]{20,}"),
              re.compile(r"-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----"),
          ]
          names = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          hits = []
          for name in filter(None, names):
              path = Path(name)
              if path.name == "runtime_security.audit.key":
                  hits.append(name)
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append(f"{name}:{line_no}")
          if hits:
              print("Potential secrets found:")
              print("\n".join(hits))
              sys.exit(1)

      - name: Install docs dependencies
        run: npm ci

      - name: Audit docs dependencies
        run: npm audit --audit-level=moderate

      - name: Build docs
        run: npm run docs:build

      - name: Check patch formatting
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git show --check --format= "${{ github.sha }}"
          fi
