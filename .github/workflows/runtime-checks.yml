name: Runtime checks

on:
  push:
    branches:
      - main
    paths:
      - scripts/cc-orchestrator/**
      - examples/workflows/**
      - .github/workflows/runtime-checks.yml
  pull_request:
    paths:
      - scripts/cc-orchestrator/**
      - examples/workflows/**
      - .github/workflows/runtime-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/cc-orchestrator/requirements-runtime.txt

      - name: Compile Python entrypoints
        run: python -m py_compile scripts/cc-orchestrator/cc_orchestrator.py scripts/cc-orchestrator/runtime_security.py scripts/cc-orchestrator/process_identity.py scripts/cc-orchestrator/secure_payload_store.py scripts/cc-orchestrator/server.py

      - name: Run guarded runtime contract tests
        run: python -m unittest scripts/cc-orchestrator/tests/test_runtime_security.py scripts/cc-orchestrator/tests/test_process_identity.py scripts/cc-orchestrator/tests/test_secure_payload_store.py scripts/cc-orchestrator/tests/test_public_surfaces.py -v

      - name: Run orchestrator selftest
        run: python scripts/cc-orchestrator/cc_orchestrator.py selftest
